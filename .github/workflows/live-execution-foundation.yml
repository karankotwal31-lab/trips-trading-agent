name: Live Execution Foundation Verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # GitHub-hosted runner remains the zero-maintenance default.
    # If account-hosted Actions capacity is unavailable, the identical commands in
    # scripts/verify_live_foundation.py can be run on any Python 3.12 host/runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify complete live foundation
        run: python scripts/verify_live_foundation.py
