name: Trips Cloud Paper Cycle

on:
  workflow_dispatch:
    inputs:
      command:
        description: "cycle or bootstrap"
        required: true
        default: "cycle"
        type: choice
        options: [cycle, bootstrap]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: trips-cloud-paper-authoritative
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TRIPS_CLOUD_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require cloud secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEON_DATABASE_URL" || { echo "NEON_DATABASE_URL missing" >&2; exit 2; }
      - name: Install cloud adapter
        run: python -m pip install -r infra/requirements-cloud.txt
      - name: Verify infrastructure manifest
        run: python infra/verify_infra.py
      - name: Verify frozen v0.6 core hashes
        run: sha256sum -c infra/core_v06.sha256
      - name: Run cloud cycle
        if: github.event_name == 'schedule' || inputs.command == 'cycle'
        run: PYTHONPATH=infra python infra/cloud_cycle.py cycle
      - name: Explicit one-time bootstrap
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'bootstrap'
        run: PYTHONPATH=infra python infra/cloud_cycle.py bootstrap
