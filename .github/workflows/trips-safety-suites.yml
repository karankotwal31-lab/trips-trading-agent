name: Trips Safety Suites

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen v0.6 core
        run: |
          set -euo pipefail
          sha256sum -c infra/core_v06.sha256
      - name: Confirm interpreter
        run: |
          set -euo pipefail
          python3 --version
      - name: Verify infrastructure manifest
        run: python3 infra/verify_infra.py
      - name: Verify safety-suite integrity
        run: python3 tests/suite_integrity.py
      - name: All safety suites
        run: python3 tests/run_all_tests.py
      - name: Execution-layer live-lock status
        run: PYTHONPATH=engine python3 engine/execution/status.py
